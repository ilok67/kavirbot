name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q KavirBot.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: KavirBot

      - name: Build
        working-directory: KavirBot
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp KavirBot/app/build/outputs/apk/debug/app-debug.apk KavirBot-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KavirBot-apk
          path: KavirBot-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KavirBot-*.apk
          generate_release_notes: true
